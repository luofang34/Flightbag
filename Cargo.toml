[workspace]
resolver = "3"
members = [
    "crates/flightbag",
    "crates/flightbag-core",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/luofang34/Flightbag"

[workspace.dependencies]
flightbag-core = { path = "crates/flightbag-core" }
world-core = { path = "../world/crates/world-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
disallowed_types = "deny"
