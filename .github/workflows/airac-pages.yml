# Publishes FAA 28-day NASR airspace and CIFP editions: one Release per cycle
# (`airac-YYYY-MM-DD`), a rolling manifest Release (`flightbag-manifest`), and a GitHub Pages
# site listing the effective and the pre-staged edition in `cycles.json`.
#
# Every run is the same idempotent `scripts/publish-editions.sh`; what is `current` depends on
# the wall clock against each edition's effective time, never on which trigger fired. GitHub
# may start scheduled runs late or drop them, so a later run always completes the work.

name: Publish Flightbag Editions

on:
  schedule:
    # FAA posts an edition weeks before it is effective, on no fixed minute. Probing every
    # three hours builds a new posting the same day; a run that finds nothing new exits after
    # the probes without touching Releases or Pages.
    - cron: "23 */3 * * *"
    # Editions become effective on AIRAC Thursdays at 09:01Z. These runs move `current` to the
    # pre-staged edition right after the cutover; on other Thursdays they find nothing to do.
    - cron: "6,21,41 9 * * 4"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild the current and upcoming editions even if their Releases are complete"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Runs queue instead of overlapping so two runs never upload to the same Release at once.
concurrency:
  group: "flightbag-airac-pages"
  cancel-in-progress: false

jobs:
  publish:
    name: Build new editions, update Releases, stage Pages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.publish.outputs.deploy }}
      required_failed: ${{ steps.publish.outputs.required_failed }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build flightbag CLI (release)
        run: cargo build --locked --release -p flightbag-cli

      # A pinning service stores CIDs it fetches from a peer; with no node configured the
      # publisher starts this one for the duration of the run.
      - name: Install Kubo for the pinning service
        if: vars.IPFS_PIN_SERVICE_URL != '' && vars.IPFS_KUBO_RPC_URL == ''
        run: ./scripts/install-kubo.sh "$RUNNER_TEMP/kubo" >>"$GITHUB_PATH"

      - name: Publish editions and stage the Pages site
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # All optional: without a node or a pinning service the run records CIDs and pins nothing.
          IPFS_KUBO_RPC_URL: ${{ vars.IPFS_KUBO_RPC_URL }}
          IPFS_KUBO_RPC_TOKEN: ${{ secrets.IPFS_KUBO_RPC_TOKEN }}
          IPFS_PIN_SERVICE_URL: ${{ vars.IPFS_PIN_SERVICE_URL }}
          IPFS_PIN_SERVICE_TOKEN: ${{ secrets.IPFS_PIN_SERVICE_TOKEN }}
          IPFS_GATEWAY_URL: ${{ vars.IPFS_GATEWAY_URL }}
          FORCE_REBUILD: ${{ inputs.force_rebuild == true && 'true' || 'false' }}
          # A manual run always redeploys, which also publishes style or page changes.
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")"
          export LIVE_INDEX_URL="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/cycles.json"
          ./scripts/publish-editions.sh

      - name: Upload Pages artifact
        if: steps.publish.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy Pages
    needs: publish
    if: needs.publish.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4

  # Reported separately so a verified NASR edition still deploys when another effective product
  # is missing, while the run as a whole turns red.
  verdict:
    name: Effective editions published
    needs: publish
    if: needs.publish.outputs.required_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::An effective edition is missing; see the publish job log."
          exit 1
